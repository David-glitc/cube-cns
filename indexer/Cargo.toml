[package]
name = "cns-index"
version = "0.1.0"
edition = "2021"
authors = ["David <https://x.com/davidpereishim>"]
license = "CC0-1.0"

[[bin]]
name = "cns-index"
path = "src/main.rs"

[dependencies]
sled = "0.34.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4.3"
